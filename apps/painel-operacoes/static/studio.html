<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio — JPOS</title>
<style>
:root{
  --bg:#eef4f1;--bg2:#dbeae3;
  --glass:rgba(255,255,255,.62);--glass-borda:rgba(255,255,255,.85);
  --esmeralda:#059669;--esmeralda-esc:#065f46;--esmeralda-cl:#10b981;
  --ink:#0f2f24;--mut:#40695c;
  --line:rgba(6,95,70,.16);--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box;margin:0}
body{
  background:
    radial-gradient(820px 420px at 88% -8%,rgba(16,185,129,.30),transparent 62%),
    radial-gradient(680px 400px at 5% 8%,rgba(5,150,105,.16),transparent 60%),
    linear-gradient(170deg,var(--bg),var(--bg2));
  background-attachment:fixed;
  color:var(--ink);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  padding:18px 14px 60px;max-width:1180px;margin:0 auto}
a{color:var(--esmeralda-esc);text-decoration:none;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:1.45rem;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:.85rem;margin:2px 0 16px}
.abas{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.aba{cursor:pointer;font-size:.85rem;padding:7px 16px;border-radius:20px;
  background:rgba(255,255,255,.66);border:1px solid var(--glass-borda);color:var(--mut);
  font-weight:600;transition:.15s;backdrop-filter:blur(8px)}
.aba:hover{border-color:var(--esmeralda);color:var(--esmeralda-esc)}
.aba.on{background:var(--esmeralda);color:#fff;border-color:var(--esmeralda)}
.painel{display:none}.painel.on{display:block}

/* placar */
.placar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.meta{background:var(--glass);backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);border:1px solid var(--glass-borda);
  border-radius:16px;padding:12px 15px;position:relative;overflow:hidden;
  box-shadow:0 4px 18px rgba(6,95,70,.09)}
.meta .t{font-size:.72rem;color:var(--mut);font-weight:700;letter-spacing:.06em}
.meta .n{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.meta .d{font-size:.72rem;color:var(--mut)}

/* grade da galeria */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--glass);backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  border:1px solid var(--glass-borda);border-radius:18px;overflow:hidden;
  box-shadow:0 6px 24px rgba(6,95,70,.10);
  transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(6,95,70,.20)}
/* PREVIEW: o site de verdade, escalado. Sem screenshot => nunca fica velho. */
.shot{position:relative;height:232px;overflow:hidden;background:#fff;
  border-bottom:1px solid var(--line);flex:none}
.shot iframe{position:absolute;top:0;left:0;width:1280px;height:892px;border:0;
  transform:scale(.26);transform-origin:top left;pointer-events:none}
.shot .vazio{display:flex;height:100%;align-items:center;justify-content:center;
  color:var(--mut);font-size:.82rem;background:repeating-linear-gradient(45deg,
    rgba(6,95,70,.04) 0 10px,transparent 10px 20px)}
.shot .selo{position:absolute;top:8px;right:8px;font-size:.68rem;font-weight:800;
  padding:3px 9px;border-radius:12px;background:rgba(5,150,105,.92);color:#fff;
  letter-spacing:.04em;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.shot .selo.stub{background:rgba(185,28,28,.92)}
.shot .selo.orfao{background:rgba(180,83,9,.92)}
.corpo{padding:13px 15px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
.nome{font-weight:700;font-size:1.02rem;letter-spacing:-.01em;line-height:1.25}
.chamada{color:var(--mut);font-size:.82rem;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.secs{display:flex;flex-wrap:wrap;gap:4px;margin-top:1px}
.sec{font-size:.68rem;padding:2px 8px;border-radius:10px;background:rgba(5,150,105,.12);
  color:var(--esmeralda-esc);font-weight:600;border:1px solid rgba(6,95,70,.14)}
.cores{display:flex;gap:4px;align-items:center}
.cores i{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.12);display:inline-block}
.rodape{display:flex;justify-content:space-between;align-items:center;gap:8px;
  margin-top:auto;padding-top:8px;border-top:1px solid var(--line);font-size:.76rem;color:var(--mut)}
.aviso{font-size:.74rem;color:var(--warn);font-weight:700}
.btn{cursor:pointer;font:inherit;font-size:.78rem;font-weight:700;padding:5px 12px;border-radius:14px;
  border:1px solid var(--esmeralda);background:var(--esmeralda);color:#fff}
.btn.sec{background:transparent;color:var(--esmeralda-esc)}
.btn:hover{filter:brightness(1.06)}

/* briefing */
.form{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-borda);
  border-radius:18px;padding:16px 18px;box-shadow:0 6px 24px rgba(6,95,70,.10);margin-bottom:14px}
label{display:block;font-size:.76rem;font-weight:700;color:var(--mut);letter-spacing:.04em;margin:10px 0 3px}
input,textarea,select{width:100%;background:rgba(255,255,255,.78);border:1px solid var(--glass-borda);
  color:var(--ink);border-radius:12px;padding:9px 13px;font:inherit;font-size:.88rem}
textarea{min-height:110px;resize:vertical}
.linha{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.diag{margin-top:14px}
.ok{background:rgba(5,150,105,.12);border-left:4px solid var(--esmeralda);
  padding:11px 14px;border-radius:12px;font-size:.87rem}
.err{background:rgba(180,83,9,.13);border-left:4px solid var(--warn);
  padding:11px 14px;border-radius:12px;font-size:.87rem}
.falta{font-size:.8rem;color:var(--ink);margin:5px 0 0 2px}
.falta b{color:var(--warn)}
.proc{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.p{font-size:.7rem;padding:2px 9px;border-radius:10px;font-weight:700}
.p.real{background:rgba(5,150,105,.16);color:var(--esmeralda-esc)}
.p.inferido{background:rgba(180,83,9,.15);color:var(--warn)}
.p.gerado{background:rgba(124,58,237,.14);color:#6d28d9}
.vazio2{color:var(--mut);font-size:.9rem;padding:26px 0;text-align:center}
</style></head><body>

<div class="top">
  <div>
    <h1>Studio</h1>
    <div class="sub">Briefing com procedência e tier como contrato · galeria com preview ao vivo.
      A <a href="/obs/criacao">Criação de site</a> atual segue no ar, intacta.</div>
  </div>
</div>

<div class="abas">
  <div class="aba on" data-p="galeria" onclick="aba('galeria')">Galeria</div>
  <div class="aba" data-p="briefing" onclick="aba('briefing')">Briefing</div>
</div>

<!-- ===================== GALERIA ===================== -->
<div class="painel on" id="p-galeria">
  <div class="placar" id="placar"></div>
  <div class="grade" id="grade"><div class="vazio2">carregando…</div></div>
</div>

<!-- ===================== BRIEFING ==================== -->
<div class="painel" id="p-briefing">
  <div class="form">
    <div class="linha">
      <div><label>Nome do negócio</label><input id="b-nome" placeholder="Clínica Aurea"></div>
      <div><label>Site atual (opcional)</label><input id="b-site" placeholder="https://…"></div>
      <div><label>Tier vendido</label><select id="b-tier">
        <option>T1</option><option>T2</option><option>T3</option><option>T4</option></select></div>
    </div>
    <div class="linha">
      <div><label>Fotos recebidas</label><input id="b-fotos" type="number" min="0" value="0"></div>
      <div><label>Vídeos recebidos</label><input id="b-videos" type="number" min="0" value="0"></div>
    </div>
    <label>Formulário do cliente (cola a resposta crua)</label>
    <textarea id="b-form" placeholder="Nome da empresa: …&#10;Segmento: …&#10;Cidade: …&#10;WhatsApp: …"></textarea>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="ingerir()">Consolidar briefing</button>
      <button class="btn sec" onclick="verEscopo()">Ver escopo do tier</button>
    </div>
    <div class="diag" id="b-res"></div>
  </div>
</div>

<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function aba(n){
  document.querySelectorAll(".aba").forEach(a=>a.classList.toggle("on",a.dataset.p===n));
  document.querySelectorAll(".painel").forEach(p=>p.classList.toggle("on",p.id==="p-"+n));
}

/* ---------- GALERIA ---------- */
function selo(s){
  if(s.status==="stub")return '<span class="selo stub">STUB</span>';
  if(String(s.status).startsWith("órfão"))return '<span class="selo orfao">SEM ARQUIVO</span>';
  return '<span class="selo">NO AR</span>';
}
function shot(s){
  // preview = o site de verdade, na mesma origem, escalado. loading=lazy: só carrega
  // o que entra na tela, senão 40 sites = 40 páginas baixadas de uma vez.
  if(String(s.status).startsWith("órfão"))
    return '<div class="vazio">registro sem arquivo em disco</div>';
  return `<iframe src="${esc(s.url)}" loading="lazy" sandbox="allow-scripts"
            title="preview de ${esc(s.slug)}" tabindex="-1" aria-hidden="true"></iframe>`;
}
async function carregarGaleria(){
  let d;
  try{ d=await(await fetch("/api/studio/galeria")).json(); }
  catch(e){ $("grade").innerHTML=`<div class="vazio2">falhou carregar: ${esc(e.message)}</div>`; return; }
  const S=d.sites||[];
  $("placar").innerHTML=`
    <div class="meta"><div class="t">SITES</div><div class="n">${d.total}</div>
      <div class="d">${S.filter(x=>x.status==="no ar").length} no ar</div></div>
    <div class="meta"><div class="t">ESTRUTURAS</div><div class="n">${d.estruturas_distintas}</div>
      <div class="d">esqueletos diferentes</div></div>
    <div class="meta"><div class="t">DIVERSIDADE</div><div class="n">${d.diversidade}%</div>
      <div class="d">${d.repetidos} repetindo esqueleto</div></div>`;
  if(!S.length){ $("grade").innerHTML='<div class="vazio2">nenhum site gerado ainda</div>'; return; }
  $("grade").innerHTML=S.map(s=>`<div class="card">
    <div class="shot">${shot(s)}${selo(s)}</div>
    <div class="corpo">
      <div class="nome">${esc(s.titulo||s.cliente||s.slug)}</div>
      ${s.chamada?`<div class="chamada">${esc(s.chamada)}</div>`:""}
      <div class="secs">${(s.secoes||[]).map(x=>`<span class="sec">${esc(x)}</span>`).join("")||
        '<span class="sec">sem seções detectadas</span>'}</div>
      ${(s.cores||[]).length?`<div class="cores">${s.cores.map(c=>
        `<i style="background:${esc(c)}" title="${esc(c)}"></i>`).join("")}</div>`:""}
      <div class="rodape">
        <span>${esc(s.segmento||"—")} · ${s.kb||0}kb${
          s.iguais>0?` · <span class="aviso">mesmo esqueleto de ${s.iguais}</span>`:""}</span>
        <a class="btn sec" href="${esc(s.url)}" target="_blank" rel="noopener">abrir ↗</a>
      </div>
    </div></div>`).join("");
}

/* ---------- BRIEFING (ingestão + tier como contrato) ---------- */
function proc(p){
  const r=[];for(const [k,v] of Object.entries(p||{})) if(v) r.push(
    `<span class="p ${esc(v)}">${esc(k)}: ${esc(v)}</span>`);
  return r.length?`<div class="proc">${r.join("")}</div>`:"";
}
async function ingerir(){
  const nome=$("b-nome").value.trim();
  if(!nome){ $("b-res").innerHTML='<div class="err">Diz o nome do negócio primeiro.</div>'; return; }
  $("b-res").innerHTML='<div class="ok">consolidando… (buscando site atual, se houver)</div>';
  const corpo={nome,site_url:$("b-site").value.trim(),formulario:$("b-form").value,
               fotos:+$("b-fotos").value||0,videos:+$("b-videos").value||0,usar_crm:true};
  let d;
  try{ d=await(await fetch("/api/criacao/ingerir",{method:"POST",
        headers:{"content-type":"application/json"},body:JSON.stringify(corpo)})).json(); }
  catch(e){ $("b-res").innerHTML=`<div class="err">erro de rede: ${esc(e.message)}</div>`; return; }
  const m=d.material||{};
  // o mesmo material vai pro contrato de tier: sustenta o que o JP vendeu?
  let v={};
  try{ v=await(await fetch("/api/criacao/validar-tier",{method:"POST",
        headers:{"content-type":"application/json"},
        body:JSON.stringify({...m,tier:$("b-tier").value})})).json(); }
  catch(e){ v={mensagem:"não deu pra validar o tier: "+e.message,faltas:[]}; }
  const fontes=(d.fontes||[]).map(f=>
    `${f.ok?"✓":"✗"} ${esc(f.tipo)}${f.erro?" — "+esc(f.erro):""}`).join(" · ");
  $("b-res").innerHTML=`
    <div class="${v.ok?"ok":"err"}"><b>${esc(v.mensagem||"")}</b></div>
    ${(v.faltas||[]).map(f=>
      `<div class="falta">• <b>${esc(f.campo)}</b> (${esc(f.tier)}) — ${esc(f.porque)}</div>`).join("")}
    <div class="falta" style="margin-top:10px">
      ${d.campos_reais}/${d.campos_total} campos vindos do cliente · ${esc(fontes)}</div>
    ${proc(d.proveniencia)}
    ${(v.escopo||[]).length?`<div class="falta" style="margin-top:8px">
      <b>${esc(v.tier)} executa:</b> ${v.escopo.map(esc).join(" · ")}</div>`:""}`;
}
async function verEscopo(){
  const t=$("b-tier").value;
  const d=await(await fetch("/api/criacao/escopo?tier="+encodeURIComponent(t))).json();
  $("b-res").innerHTML=`<div class="ok"><b>${esc(d.tier)} executa ${
    (d.escopo||[]).length} entregas:</b><br>${(d.escopo||[]).map(esc).join(" · ")}</div>`;
}

carregarGaleria();
</script></body></html>
