<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caixa de Ideias — JPOS</title>
<style>
:root{--bg:#0a0e14;--card:#111823;--line:#1e2a3a;--ink:#e6edf3;--mut:#7d8da3;--cy:#38bdf8;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;padding:20px;max-width:900px}
a{color:var(--cy)}h1{font-size:1.4rem;margin:.2em 0}.sub{color:var(--mut);font-size:.9rem;margin-top:0}
.voltar{position:fixed;top:14px;left:14px;background:rgba(0,0,0,.55);color:#fff;text-decoration:none;padding:7px 13px;border-radius:20px;font-size:.85rem;font-weight:600}
.dom{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.dom h2{font-size:1.05rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.dom h2 .n{font-size:.75rem;color:var(--mut);font-weight:400;background:#0c131d;border:1px solid var(--line);padding:1px 9px;border-radius:20px}
.ideia{border-left:3px solid var(--cy);padding:6px 0 6px 12px;margin:8px 0}
.ideia .txt{color:var(--ink)}
.ideia .src{color:var(--mut);font-size:.76rem;margin-top:2px}
.ideia .src a{text-decoration:none}
.empty{color:var(--mut);text-align:center;padding:28px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{cursor:pointer;font-size:.8rem;padding:4px 12px;border-radius:20px;background:#0c131d;border:1px solid var(--line);color:var(--mut)}
.chip.on{background:var(--cy);color:#001;border-color:var(--cy);font-weight:600}
.csv{font-size:.72rem;font-weight:600;text-decoration:none;background:var(--ok);color:#001;padding:4px 11px;border-radius:20px;vertical-align:middle;margin-left:10px;white-space:nowrap}
.busca{width:100%;margin-bottom:12px;background:#0c131d;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit}
.busca::placeholder{color:var(--mut)}
.ideia .m{display:inline-block;font-size:.72rem;font-weight:700;background:var(--warn);color:#001;padding:0 8px;border-radius:20px;margin-right:6px}
</style></head><body>
<a class="voltar" href="/obs" title="Voltar" onclick="if(history.length>1){history.back();return false}">‹ Voltar</a>
<h1>💡 Caixa de Ideias <a class="csv" href="/api/ideias.csv" title="Baixar tudo em CSV (UTF-8, abre no Excel PT-BR)">⬇️ CSV</a></h1>
<p class="sub">Templates replicáveis colhidos de <b>tudo</b> que o Radar analisou — por domínio, com a fonte. O que dá pra transformar em vídeo, site, produto, operação. Cresce sozinho a cada análise.</p>
<div class="filtros" id="filtros"></div>
<input class="busca" id="busca" type="search" placeholder="🔎 buscar em todas as ideias…" oninput="render()" autocomplete="off">
<div id="lista"><p class="empty">carregando…</p></div>
<script>
const $ = id => document.getElementById(id);
const META = {video:['🎬','Vídeo'],site:['🌐','Site'],negocio:['💼','Negócio'],
              produto:['📦','Produto'],operacao:['⚙️','Operação'],projeto:['🧪','Projeto']};
// upgrade e: a Caixa consome o ROTEAMENTO do Radar — ideias agrupadas por motor.
const MOTOR_META = {'arbitragem':['💱','Arbitragem'],'motor-site':['🌐','Motor Site'],
                    'motor-b':['🎬','Motor B'],'noemi':['💬','Noemi']};
let DADOS = {grupos:{},por_motor:{},total:0}, filtro = 'todos', vista = 'dominio';
let EXPAND = {};  // #10: por domínio, mostra top-8 (já ordenadas por feedback×score) + "ver mais"
let AUTO = null;  // task 2: auto-análise da própria operação (amarelo/vermelho)

function renderAuto(){
  if(AUTO===null){ $('lista').innerHTML='<p class="empty">carregando auto-análise…</p>'; return; }
  const btn = `<div style="margin-bottom:12px"><span class="chip" onclick="rodarAuto()">🔄 reanalisar o banco</span></div>`;
  if(!AUTO.length){ $('lista').innerHTML=btn+'<p class="empty">Sem achados ainda — clica em reanalisar (roda a skill sobre o que o Radar já coletou).</p>'; return; }
  $('lista').innerHTML = btn + AUTO.map(i=>{
    const verm = i.nivel==='vermelho';
    return `<div class="dom" style="border-left:4px solid ${verm?'#f87171':'#fbbf24'}">
      <h2 style="font-size:.95rem">${verm?'🔴 VERMELHO':'🟡 AMARELO'} <span class="n">★${i.score}</span></h2>
      <div class="ideia" style="border-left:0;padding-left:0"><div class="txt">${i.achado}</div>
      <div class="txt" style="color:var(--ok);font-size:.9rem;margin-top:4px">→ ${i.acao||''}</div>
      <div class="src">origem: ${i.origem||'—'}</div></div></div>`;
  }).join('');
}
window.rodarAuto = async ()=>{ $('lista').innerHTML='<p class="empty">reanalisando (Groq)…</p>';
  try{ const r=await (await fetch('/api/auto-analise/rodar',{method:'POST'})).json(); AUTO=r.itens||[]; }catch(e){ AUTO=[]; } renderAuto(); };

function ativo(){
  return vista==='motor' ? {meta:MOTOR_META, g:DADOS.por_motor||{}}
                         : {meta:META, g:DADOS.grupos||{}};
}
function fonte(i){
  const d = (i.data||'').slice(0,10);
  const org = i.origem || '—';
  const link = i.url ? `<a href="${i.url}" target="_blank" rel="noopener">${org}</a>` : org;
  return `de ${link} · ${d} · ★${i.score??'?'}`;
}
function q(){ return ($('busca')?.value||'').trim().toLowerCase(); }
function casa(txt){ const t=q(); return !t || (txt||'').toLowerCase().includes(t); }
function render(){
  if(vista==='auto') return renderAuto();
  if(vista==='produto') return renderProdutos();
  const {meta,g} = ativo();
  if(!DADOS.total){ $('lista').innerHTML = `<p class="empty">Ainda sem ideias. Manda vídeos pro Radar (@noemi_alert_bot) que a caixa enche sozinha.</p>`; return; }
  const chaves = Object.keys(meta).filter(d => (filtro==='todos'||filtro===d) && (g[d]||[]).length);
  const LIM = 8, buscando = !!q();
  $('lista').innerHTML = chaves.map(d => {
    const its = (g[d]||[]).filter(i => casa(i.ideia));
    if(!its.length) return '';
    const ic = meta[d];
    const vis = (EXPAND[d] || buscando) ? its : its.slice(0, LIM);  // busca mostra tudo que casa
    const resto = its.length - vis.length;
    return `<div class="dom"><h2>${ic[0]} ${ic[1]} <span class="n">${its.length}</span></h2>`+
      vis.map(i => `<div class="ideia"><div class="txt">${i.ideia}</div><div class="src">${fonte(i)}</div></div>`).join('')+
      (resto > 0 ? `<span class="chip" style="margin-top:8px" onclick="EXPAND['${d}']=1;render()">+${resto} mais</span>` : '')+
    `</div>`;
  }).join('') || `<p class="empty">${q()?'nada casa com a busca':'nada nesse '+(vista==='motor'?'motor':'domínio')}</p>`;
}
function renderProdutos(){
  // upgrade: a Caixa passa a MOSTRAR as ferramentas/produtos candidatos (dado que o
  // harvest já colhia mas a UI descartava). Recorrência (menções) = sinal de demanda.
  const fs = (DADOS.ferramentas||[]).filter(f => casa(f.nome));
  if(!fs.length){ $('lista').innerHTML = `<p class="empty">${q()?'nada casa com a busca':'Nenhuma ferramenta/produto citado ainda nas análises.'}</p>`; return; }
  $('lista').innerHTML = `<div class="dom"><h2>📦 Produtos candidatos <span class="n">${fs.length}</span></h2>`+
    `<p class="src" style="margin:-4px 0 10px">Ferramentas citadas nos vídeos analisados — recorrência = sinal de demanda.</p>`+
    fs.map(f => `<div class="ideia"><div class="txt"><span class="m">${f.mencoes}×</span>${f.nome}</div><div class="src">${fonte(f)}</div></div>`).join('')+
  `</div>`;
}
function pintarFiltros(){
  const toggles =
    `<span class="chip ${vista==='dominio'?'on':''}" onclick="setVista('dominio')">📂 Por domínio</span>`+
    `<span class="chip ${vista==='motor'?'on':''}" onclick="setVista('motor')">🚀 Por motor</span>`+
    `<span class="chip ${vista==='auto'?'on':''}" onclick="setVista('auto')">🔎 Auto-análise</span>`+
    `<span class="chip ${vista==='produto'?'on':''}" onclick="setVista('produto')">📦 Produtos</span>`;
  if(vista==='auto'||vista==='produto'){ $('filtros').innerHTML = toggles; return; }  // sem chips de domínio
  const {meta,g} = ativo();
  const cnt = d => (g[d]||[]).length;
  const total = Object.keys(meta).reduce((s,d)=>s+cnt(d),0);
  const chips = [['todos','Tudo',total]].concat(
    Object.keys(meta).filter(d=>cnt(d)).map(d=>[d,meta[d][0]+' '+meta[d][1],cnt(d)]));
  $('filtros').innerHTML = toggles +
    `<span style="flex-basis:100%;height:0"></span>`+
    chips.map(([k,l,n])=>
      `<span class="chip ${k===filtro?'on':''}" onclick="filtro='${k}';pintarFiltros();render()">${l} (${n})</span>`).join('');
}
window.setVista = v => {
  vista=v; filtro='todos'; pintarFiltros();
  const b=$('busca'); if(b) b.style.display = v==='auto' ? 'none' : '';  // busca não se aplica ao auto
  if(v==='auto' && AUTO===null){ fetch('/api/auto-analise').then(r=>r.json())
    .then(d=>{AUTO=d.itens||[];renderAuto();}).catch(()=>{AUTO=[];renderAuto();}); }
  render();
};
fetch('/api/ideias').then(r=>r.json()).then(d=>{DADOS=d;pintarFiltros();render();})
  .catch(()=>{$('lista').innerHTML='<p class="empty">erro ao carregar</p>';});
</script>
</body></html>
