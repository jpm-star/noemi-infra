<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pé Di · Primeiro toque</title>
<style>
:root{--bg:#060a12;--panel:#0c1422;--panel2:#0f1a2c;--line:#1b2942;--cy:#34e2ff;--op:#2fe6a0;
      --ri:#ffb020;--mut:#8aa2c0;--txt:#e6edf7;--wa:#25d366}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(700px 400px at 100% 0%,rgba(47,230,160,.06),transparent 55%),var(--bg);
     color:var(--txt);font:15px/1.5 system-ui,-apple-system,sans-serif;padding:22px 16px;max-width:820px;margin:0 auto}
a{color:var(--cy);text-decoration:none}
h1{font-size:1.35rem;margin-bottom:2px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.sub{color:var(--mut);font-size:.85rem;margin-bottom:16px}
.placar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 14px;flex:1 1 110px}
.kpi small{color:var(--mut);font-size:.7rem;display:block}
.kpi b{font-size:1.3rem;font-variant-numeric:tabular-nums}
.filtros{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.filtros button{background:transparent;color:var(--mut);border:1px solid var(--line);padding:5px 12px;
                border-radius:20px;cursor:pointer;font:inherit;font-size:.8rem}
.filtros button.on{background:rgba(52,226,255,.14);color:var(--cy);border-color:var(--cy);font-weight:700}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
      border-radius:14px;padding:13px 15px;margin-bottom:11px}
.card.feito{opacity:.45}
.cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cab b{font-size:1.02rem}
.meta{color:var(--mut);font-size:.79rem;margin-top:2px}
.sc{background:rgba(47,230,160,.12);color:var(--op);border:1px solid rgba(47,230,160,.35);
    border-radius:8px;padding:2px 9px;font-size:.78rem;font-weight:700;white-space:nowrap}
.msg{background:#08101d;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
     margin:10px 0 9px;font-size:.85rem;color:#c8d6ea;white-space:pre-wrap;max-height:78px;overflow:hidden;
     position:relative;cursor:pointer}
.msg.aberta{max-height:none}
.msg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;
            background:linear-gradient(transparent,#08101d)}
.msg.aberta::after{display:none}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wa{background:var(--wa);color:#04220f;font-weight:700;border:0;border-radius:9px;padding:9px 16px;
    cursor:pointer;font:inherit;font-weight:700}
.wa:hover{filter:brightness(1.08)}
.gh{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:9px;
    padding:8px 12px;cursor:pointer;font:inherit;font-size:.83rem}
.gh:hover{color:var(--txt)}
.vazio{color:var(--mut);text-align:center;padding:40px 10px}
</style></head><body>

<div class="top"><h1>📲 Pé Di · Primeiro toque</h1><a href="/obs">← QG</a></div>
<div class="sub">A fila em ordem de prioridade, com a mensagem já escrita e o preço vindo da calculadora.
  O botão abre o WhatsApp — quem manda é você, um por vez.</div>

<div class="placar" id="placar"></div>
<div class="filtros">
  <button class="on" data-f="fila" onclick="setF(this)">Na fila</button>
  <button data-f="todos" onclick="setF(this)">Todos</button>
</div>
<div id="lista"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let FILTRO = 'fila';

function setF(b) {
  document.querySelectorAll('.filtros button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  FILTRO = b.dataset.f;
  carregar();
}

async function carregar() {
  const r = await (await fetch('/api/pedi/toque?todos=' + (FILTRO === 'todos' ? 1 : 0))).json();
  const p = r.placar;
  $('#placar').innerHTML =
    `<div class="kpi"><small>na fila</small><b>${p.restam}</b></div>` +
    `<div class="kpi"><small>já tocados</small><b>${p.tocados}</b></div>` +
    `<div class="kpi"><small>total discável</small><b>${p.total}</b></div>`;

  $('#lista').innerHTML = r.fila.length ? r.fila.map(l => `
    <div class="card ${l.tocado_em ? 'feito' : ''}">
      <div class="cab">
        <div>
          <b>${esc(l.empresa)}</b>
          <div class="meta">${esc(l.segmento)} · ${esc(l.cidade)} · ${esc(l.telefone)}
            ${l.instagram ? ' · ' + esc(l.instagram) : ''}
            ${l.tocado_em ? ' · <span style="color:var(--op)">tocado ' + esc(l.tocado_em).slice(0,10) + '</span>' : ''}</div>
        </div>
        <span class="sc">${l.score}/10</span>
      </div>
      <div class="msg" onclick="this.classList.toggle('aberta')">${esc(l.mensagem)}</div>
      <div class="acoes">
        <button class="wa" onclick="abrir('${l.id}','${encodeURIComponent(l.link)}')">Abrir WhatsApp</button>
        <button class="gh" onclick="marcar('${l.id}','sem resposta')">sem resposta</button>
        <button class="gh" onclick="marcar('${l.id}','respondeu')">respondeu</button>
        ${l.site ? `<a class="gh" href="${esc(l.site)}" target="_blank" rel="noopener">site ↗</a>` : ''}
      </div>
    </div>`).join('') : '<div class="vazio">fila vazia — todo mundo já foi tocado</div>';
}

async function abrir(id, link) {
  window.open(decodeURIComponent(link), '_blank', 'noopener');
  await marcar(id, 'enviado');
}

async function marcar(id, resultado) {
  await fetch('/api/pedi/toque/marcar', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id, resultado})});
  await carregar();
}

carregar();
</script>
</body></html>
