<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motor B — Vídeo IA · Noemi</title>
<style>
  :root { --bg:#0b0f1a; --card:#131a2b; --borda:#232d45; --texto:#e6e9f0; --fraco:#8b93a7; --acento:#7c5cff; --ok:#2dd4a7; --erro:#ff6b6b; }
  * { box-sizing:border-box; margin:0 }
  body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--texto); min-height:100vh; display:grid; place-items:center; padding:24px }
  main { width:min(560px,100%) }
  h1 { font-size:1.5rem; margin-bottom:4px } h1 span{color:var(--acento)}
  p.sub { color:var(--fraco); margin-bottom:24px; font-size:.92rem }
  .card { background:var(--card); border:1px solid var(--borda); border-radius:14px; padding:20px; margin-bottom:16px }
  label { display:block; font-size:.85rem; color:var(--fraco); margin:10px 0 6px }
  input[type=text] { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--borda); background:var(--bg); color:var(--texto) }
  input[type=file] { width:100%; color:var(--fraco); font-size:.9rem }
  button { margin-top:16px; width:100%; padding:12px; border:0; border-radius:10px; background:var(--acento); color:#fff; font-size:1rem; font-weight:600; cursor:pointer }
  button:disabled { opacity:.45; cursor:default }
  #timeline { display:none; gap:6px; flex-wrap:wrap }
  .chip { padding:6px 12px; border-radius:999px; font-size:.78rem; border:1px solid var(--borda); color:var(--fraco) }
  .chip.on { border-color:var(--acento); color:var(--texto); background:rgba(124,92,255,.15) }
  .chip.done { border-color:var(--ok); color:var(--ok) }
  .chip.bad { border-color:var(--erro); color:var(--erro) }
  #resultado { display:none } video { width:100%; border-radius:10px; margin-top:8px }
  #msg { margin-top:12px; font-size:.85rem; color:var(--fraco); min-height:1.2em }
  a { color:var(--acento) }
</style>
</head>
<body>
<a class="voltar-qg" href="#" title="Voltar ao QG"
   onclick="history.length>1?history.back():(document.referrer&&location.assign(document.referrer));return false"
   style="display:none;position:fixed;top:14px;left:14px;z-index:99;background:rgba(0,0,0,.55);color:#fff;text-decoration:none;padding:7px 13px;border-radius:20px;font-size:.85rem;font-weight:600;backdrop-filter:blur(6px)">‹ Voltar</a>
<script>/* fail-safe: só mostra o voltar se houver pra onde voltar (aberto do QG) */
if(history.length>1||document.referrer)document.querySelector('.voltar-qg').style.display='block';</script>
<main>
  <h1>🎥 Motor B — <span>Vídeo IA</span></h1>
  <p class="sub">Envie fotos ou vídeo bruto do imóvel/produto e receba o vídeo pronto.</p>

  <div class="card">
    <label>Seu nome / cliente</label>
    <input type="text" id="owner" placeholder="ex.: Rodrigo Imóveis" maxlength="120">
    <label>Fotos do imóvel (pode escolher várias) ou 1 vídeo</label>
    <input type="file" id="arquivo" accept="image/*,video/*" multiple>
    <small id="conta-arq" style="color:var(--fraco);font-size:.8rem"></small>

    <details id="dadosImovel">
      <summary>Dados do imóvel (opcional — aparecem no vídeo)</summary>
      <input type="text" id="im-codigo" placeholder="Código/ref (ex.: AP-12)" maxlength="30">
      <input type="text" id="im-preco" placeholder="Preço (ex.: R$ 850 mil)" maxlength="40">
      <input type="text" id="im-bairro" placeholder="Bairro / cidade" maxlength="60">
      <input type="text" id="im-metragem" placeholder="Metragem (ex.: 72m²)" maxlength="30">
      <input type="text" id="im-dormitorios" placeholder="Dormitórios (ex.: 3 quartos)" maxlength="30">
      <input type="text" id="im-descricao" placeholder="Descrição curta (ex.: 3 quartos, vista mar)" maxlength="200">
    </details>

    <button id="gerar">Gerar vídeo</button>
    <div id="msg"></div>
  </div>

  <div class="card" id="painelStatus" style="display:none">
    <label>Progresso do job <code id="jid"></code></label>
    <div id="timeline" style="display:flex"></div>
  </div>

  <div class="card" id="resultado">
    <label>Vídeo pronto ✓</label>
    <video id="player" controls></video>
    <p><a id="baixar" download>⬇ Baixar vídeo</a></p>
  </div>
</main>
<script>
const ESTADOS = ["queued","uploading","processing","completed"];
const ROTULO = {queued:"na fila",uploading:"enviando",processing:"gerando",completed:"pronto",
                failed:"falhou",cancelled:"cancelado",retry:"tentando de novo"};
const rot = e => ROTULO[e] || e;
const $ = id => document.getElementById(id);

function pintarTimeline(estado) {
  const t = $("timeline"); t.innerHTML = "";
  const idx = ESTADOS.indexOf(estado);
  for (const e of ESTADOS) {
    const c = document.createElement("span");
    c.className = "chip" + (e === estado ? " on" : ESTADOS.indexOf(e) < idx ? " done" : "");
    if (estado === "completed") c.className = "chip done";
    c.textContent = rot(e); t.appendChild(c);
  }
  if (["failed","cancelled","retry"].includes(estado)) {
    const c = document.createElement("span");
    c.className = "chip " + (estado === "retry" ? "on" : "bad");
    c.textContent = rot(estado); t.appendChild(c);
  }
}

async function acompanhar(jobId) {
  $("painelStatus").style.display = "block"; $("jid").textContent = jobId.slice(0,8);
  let falhas = 0;
  while (true) {
    try {
      const r = await fetch(`/api/jobs/${jobId}`);
      if (r.status === 404) { $("msg").textContent = "Job não encontrado no servidor."; return; }
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      falhas = 0;
      const job = await r.json();
      pintarTimeline(job.estado);
      if (job.estado === "completed") {
        $("resultado").style.display = "block";
        $("player").src = job.video_url; $("baixar").href = job.video_url;
        $("msg").textContent = ""; return;
      }
      if (["failed","cancelled"].includes(job.estado)) {
        $("msg").textContent = job.estado === "failed" ? `Falhou: ${job.erro ?? "erro desconhecido"}` : "Cancelado.";
        return;
      }
    } catch (e) {  // 502 de restart do serviço / rede: tolera e re-tenta
      if (++falhas > 20) { $("msg").textContent = "Servidor não responde — recarregue a página em instantes."; return; }
      $("msg").textContent = "Reconectando…";
    }
    await new Promise(ok => setTimeout(ok, 1500));
  }
}

const MAX_FOTOS = 8;  // teto de fotos/vídeo: cada foto = 1 clipe Higgsfield (custo)
$("arquivo").onchange = () => {
  const n = $("arquivo").files.length;
  $("conta-arq").textContent = n > MAX_FOTOS
    ? `⚠ ${n} escolhidas — só as ${MAX_FOTOS} primeiras entram (custo por clipe)`
    : n > 1 ? `${n} fotos → vídeo walkthrough (uma cena por foto)` : "";
};

$("gerar").onclick = async () => {
  const fs = Array.from($("arquivo").files).slice(0, MAX_FOTOS);
  if (!fs.length) { $("msg").textContent = "Escolha ao menos uma foto."; return; }
  $("gerar").disabled = true; $("resultado").style.display = "none";
  try {
    const owner = $("owner").value || "cliente";
    const asset_ids = [];
    for (let i = 0; i < fs.length; i++) {
      $("msg").textContent = fs.length > 1 ? `Enviando foto ${i + 1}/${fs.length}…` : "Enviando mídia…";
      const fd = new FormData();
      fd.append("file", fs[i]); fd.append("owner", owner);
      const up = await fetch("/api/upload", { method: "POST", body: fd });
      if (!up.ok) throw new Error((await up.json()).detail);
      asset_ids.push((await up.json()).asset_id);
    }
    $("msg").textContent = "Na fila de geração…";
    // dados do imóvel (só os preenchidos) → viram overlay/caption/CTA no vídeo
    const campos = {codigo:"im-codigo", preco:"im-preco", bairro:"im-bairro",
                    metragem:"im-metragem", dormitorios:"im-dormitorios", descricao:"im-descricao"};
    const config = {};
    for (const [chave, id] of Object.entries(campos)) {
      const v = ($(id)?.value || "").trim(); if (v) config[chave] = v;
    }
    // >1 foto → cenas (o worker monta um walkthrough, 1 cena por foto). 1 só = clipe único.
    if (asset_ids.length > 1) config.cenas = asset_ids.map(id => ({ asset_id: id }));
    const cj = await fetch("/api/jobs", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ asset_id: asset_ids[0], config }) });
    if (!cj.ok) throw new Error((await cj.json()).detail);
    const { job_id } = await cj.json();
    await acompanhar(job_id);
  } catch (e) { $("msg").textContent = "Erro: " + e.message; }
  finally { $("gerar").disabled = false; }
};
</script>
</body>
</html>
