# Roteamento LLM do noemi-infra. Nomes lógicos por FUNÇÃO (nunca provider cru pra
# cima — casa com a regra do CLAUDE.md: interface fixa, provider trocável embaixo).
model_list:
  # análise/classificação: Groq primário, Ollama local como fallback
  - model_name: analise
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
  # geração/raciocínio do Motor B: Anthropic quando a chave existir
  - model_name: motor-b
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY
# Ollama (fallback local, 3B/CPU) NÃO entra no proxy de propósito: manter o
# Ollama em loopback (127.0.0.1) é mais seguro que expô-lo à bridge do Docker. O
# fallback pro local acontece no NÍVEL DO APP (shared-core/ai/local_llm.py) —
# camada 2 da cascata. Proxy cobre os cloud; local_llm cobre o offline.

litellm_settings:
  # entre os cloud: se o primário falhar, cai no outro (quando a chave existir)
  fallbacks: [{"analise": ["motor-b"]}, {"motor-b": ["analise"]}]
  drop_params: true          # ignora params que um provider não suporta
  request_timeout: 40
  # observabilidade nativa: custo/latência/modelo/erro por chamada no dashboard /ui
  # (Langfuse é plug de 3 linhas aqui — success_callback: ["langfuse"] — quando o
  #  trace-UI dedicado valer o container extra; ver infra/README.md)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
