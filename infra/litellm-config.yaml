# Roteamento LLM do noemi-infra. Nomes lógicos por FUNÇÃO (nunca provider cru pra
# cima — casa com a regra do CLAUDE.md: interface fixa, provider trocável embaixo).
model_list:
  # análise/classificação: Groq primário, Ollama local como fallback
  - model_name: analise
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
  # geração/classificação do Motor B: Groq (era Anthropic com chave vazia = 100%
  # de erro; llama-3.3-70b dá conta da classificação e tem sucesso/latência boa).
  - model_name: motor-b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
  # reserva: 2ª chave Groq (conta diferente) — fallback cross-key contra 429/TPM.
  - model_name: groq-reserva
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY_RESERVA
  # OUTRO MODELO, MESMA CHAVE — o degrau que faltava. O TPD (teto DIÁRIO de tokens) é
  # POR MODELO: quando o llama-3.3-70b estoura, qwen3.6-27b e gpt-oss-120b ainda têm
  # cota inteira na mesma key. Sem isto, estourar o 70b matava a análise do dia toda
  # (era o bug dos 45 "score 0" do Radar: LLM fora, não vídeo ruim). Não custa nada.
  # ORDEM IMPORTA: gpt-oss devolve JSON LIMPO. O qwen3.6 é modelo de RACIOCÍNIO —
  # gasta os 2200 tokens inteiros dentro de <think> e nunca emite o JSON (medido:
  # 7990 chars de raciocínio, think sem fechar, zero JSON). Serve pra visão/texto
  # livre, NÃO pra saída estruturada. Por isso fica de fora desta cascata.
  - model_name: groq-modelo-b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: groq-modelo-c
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
  # HEALTH-CHECK dedicado: a pre-checagem de cota NAO pode gastar a cota de producao
  # (checar se ha cota consumindo cota e o gato mordendo o rabo). Modelo minusculo,
  # chamada de 5 tokens. Key propria quando o JP dedicar uma; ate la usa a principal,
  # mas com modelo separado — o TPD e POR MODELO, entao ja isola o teto.
  - model_name: health-check
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_KEY_HEALTH
  # MOTOR B (video imobiliario): reservado pra quando crescer. Fica com slot proprio
  # desde ja pra o "depois" nao competir com o "agora" no dia em que ligar.
  - model_name: motor-b-video
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_KEY_MOTOR_B
  # fallback CROSS-PROVIDER: Claude (Anthropic) quando o Groq estoura o TPD DIÁRIO
  # (100k/dia por org, as 2 chaves Groq dividem o mesmo teto). O insight denso
  # (10 campos) merece o modelo forte — não o 8b da Groq. O código do llm_proxy já
  # chama model="fallback-anthropic" após o gate de 429; agora ele existe de verdade.
  - model_name: fallback-anthropic
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
# Ollama (fallback local, 3B/CPU) NÃO entra no proxy de propósito: manter o
# Ollama em loopback (127.0.0.1) é mais seguro que expô-lo à bridge do Docker. O
# fallback pro local acontece no NÍVEL DO APP (shared-core/ai/local_llm.py) —
# camada 2 da cascata. Proxy cobre os cloud; local_llm cobre o offline.

  # ── AGENTES COM CHAVE DEDICADA (JP 2026-08-05) ───────────────────────────────
  # Regra: função crítica tem chave PRÓPRIA. Um lote de 100 demos não pode comer a
  # cota da análise, e vice-versa. Só entram aqui chaves que o sdr-motor NÃO usa —
  # a Noemi já tem o isolamento dela (pool de conversação + dedicadas por função) e
  # reusar aquelas gastaria a cota dela por baixo, invisível pros dois lados.
  - model_name: site-copy          # geração de copy de site (demos do JP)
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_SITE_COPY
  # mesmos degraus dentro da PRÓPRIA chave: o TPD é POR MODELO, então trocar de
  # modelo devolve cota inteira sem depender de haver outra chave sobrando.
  - model_name: site-copy-b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_SITE_COPY
  - model_name: site-copy-c
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_SITE_COPY
  - model_name: analise-dedicada
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_ANALISE
  - model_name: analise-dedicada-b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_ANALISE

  # ── POOL COMPARTILHADO (10 chaves que estavam OCIOSAS) ───────────────────────
  # MESMO model_name repetido: o LiteLLM rotaciona entre os deployments e, no 429,
  # cai no próximo automaticamente. É overflow — só entra DEPOIS que a chave
  # dedicada da função satura, então um lote grande não rouba a cota de ninguém.
  - model_name: pool-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_POOL_01
  - model_name: pool-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_POOL_02
  - model_name: pool-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_POOL_03
  - model_name: pool-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_POOL_04
  - model_name: pool-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_POOL_05
  - model_name: pool-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_POOL_06
  - model_name: pool-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_POOL_07
  - model_name: pool-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_POOL_08
  - model_name: pool-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_POOL_09
  - model_name: pool-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_POOL_10

  # ── ÚLTIMO DEGRAU: LOCAL, SEM COTA ───────────────────────────────────────────
  # Reversão consciente da decisão antiga ("Ollama não entra no proxy"): aquele
  # fallback local só existia no NÍVEL DO APP (shared-core/local_llm.py), e o
  # motor-site é OUTRO repositório — não alcança. Com o Ollama aqui, a promessa
  # "nunca falhar por rate limit" vale pra todo caminho que passa no gateway.
  # llama3.2:3b em CPU: copy pior que a do 70b, mas demo gerada > demo nenhuma.
  - model_name: ollama-local
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://172.16.2.1:11434

  # VISÃO (multimodal). Antes cada chamador batia direto em api.groq.com com UMA chave:
  # o TPM de 8000 estourava na SEGUNDA imagem de uma rodada e a cascata engolia o 429
  # em silêncio (virava 'sem_visao'). Aqui as mesmas 10 chaves do pool giram em
  # round-robin, então uma rodada de 4 fotos não compete consigo mesma.
  # qwen3.6 é modelo de RACIOCÍNIO: quem chamar tem que mandar reasoning_effort=none,
  # senão gasta a resposta inteira dentro de <think> (ver shared-core/ai/visao.py).
  - model_name: visao
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      reasoning_effort: none
      api_key: os.environ/GROQ_POOL_01
  - model_name: visao
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      reasoning_effort: none
      api_key: os.environ/GROQ_POOL_02
  - model_name: visao
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      reasoning_effort: none
      api_key: os.environ/GROQ_POOL_03
  - model_name: visao
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      reasoning_effort: none
      api_key: os.environ/GROQ_POOL_04
  - model_name: visao
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      reasoning_effort: none
      api_key: os.environ/GROQ_POOL_05
  - model_name: visao
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      reasoning_effort: none
      api_key: os.environ/GROQ_POOL_06
  - model_name: visao
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      reasoning_effort: none
      api_key: os.environ/GROQ_POOL_07
  - model_name: visao
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      reasoning_effort: none
      api_key: os.environ/GROQ_POOL_08
  - model_name: visao
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      reasoning_effort: none
      api_key: os.environ/GROQ_POOL_09
  - model_name: visao
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      reasoning_effort: none
      api_key: os.environ/GROQ_POOL_10

  # JUIZ da auditoria adversarial (auditor_copy / qa_gate). gpt-oss-120b: arquitetura
  # DIFERENTE do llama que escreve a copy — juiz que é o próprio autor sempre se aprova.
  # Round-robin nas 10 chaves porque um gate roda em rajada (12 itens × 3 ângulos = 36
  # chamadas seguidas); numa chave só isso vira 429, o veredito some e o lote trava por
  # falta de juiz em vez de por problema real.
  - model_name: juiz
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_POOL_01
  - model_name: juiz
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_POOL_02
  - model_name: juiz
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_POOL_03
  - model_name: juiz
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_POOL_04
  - model_name: juiz
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_POOL_05
  - model_name: juiz
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_POOL_06
