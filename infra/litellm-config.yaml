# Roteamento LLM do noemi-infra. Nomes lógicos por FUNÇÃO (nunca provider cru pra
# cima — casa com a regra do CLAUDE.md: interface fixa, provider trocável embaixo).
model_list:
  # análise/classificação: Groq primário, Ollama local como fallback
  - model_name: analise
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
  # geração/classificação do Motor B: Groq (era Anthropic com chave vazia = 100%
  # de erro; llama-3.3-70b dá conta da classificação e tem sucesso/latência boa).
  - model_name: motor-b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
  # reserva: 2ª chave Groq (conta diferente) — fallback cross-key contra 429/TPM.
  - model_name: groq-reserva
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY_RESERVA
  # fallback CROSS-PROVIDER: claude-haiku (Anthropic). Mata a crise de
  # disponibilidade que hoje é refém de UMA key Groq (se o Groq cai, cai tudo).
  # NÃO entra em litellm_settings.fallbacks (que dispara no 1º erro): quem chama
  # é o app (llm_proxy.completar), só APÓS o gate de 3 429 seguidos. Inerte
  # enquanto ANTHROPIC_API_KEY estiver vazia (a chamada volta erro → None).
  - model_name: fallback-anthropic
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
# Ollama (fallback local, 3B/CPU) NÃO entra no proxy de propósito: manter o
# Ollama em loopback (127.0.0.1) é mais seguro que expô-lo à bridge do Docker. O
# fallback pro local acontece no NÍVEL DO APP (shared-core/ai/local_llm.py) —
# camada 2 da cascata. Proxy cobre os cloud; local_llm cobre o offline.

litellm_settings:
  # cascata no proxy: primário (Groq key 1) → reserva (Groq key 2). O 3º nível
  # (Ollama local → regras determinísticas) fica no app (classificacao.py).
  fallbacks: [{"analise": ["groq-reserva"]}, {"motor-b": ["groq-reserva"]}]
  drop_params: true          # ignora params que um provider não suporta
  request_timeout: 40
  cache: true                # cache de prompt em memória (hit rate era 0%) — corta
  cache_params:              # custo/latência em chamadas repetidas (ex: diagnóstico)
    type: local
  # observabilidade nativa: custo/latência/modelo/erro por chamada no dashboard /ui
  # (Langfuse é plug de 3 linhas aqui — success_callback: ["langfuse"] — quando o
  #  trace-UI dedicado valer o container extra; ver infra/README.md)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
